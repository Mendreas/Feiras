&lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js&quot;&gt;&lt;/script&gt;
&lt;style&gt;
:root{
  --toldo:#1F4D3A;        /* verde toldo escuro */
  --toldo2:#2A6B4F;       /* verde toldo claro */
  --laranja:#E8891C;      /* laranja de banca de citrinos */
  --vermelho:#C43E2F;     /* vermelho de toldo */
  --tinta:#21251F;
  --papel:#F7F5EF;
  --cartao:#FFFFFF;
  --linha:#E2DED2;
  --cinza:#6E6A5E;
  --azul:#2F6690;
  --roxo:#7B4B94;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:&#x27;Instrument Sans&#x27;,system-ui,sans-serif;background:var(--papel);color:var(--tinta);display:flex;flex-direction:column;overflow:hidden}

/* ---------- Cabeçalho com toldo ---------- */
header{background:var(--toldo);color:#fff;padding:14px 20px 10px;position:relative;z-index:1200}
.hd-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px}
h1{font-family:&#x27;Bricolage Grotesque&#x27;,sans-serif;font-weight:800;font-size:clamp(20px,3vw,30px);letter-spacing:-.02em}
h1 span{color:#F4C566}
.hd-date{font-size:13px;opacity:.85}
.hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.app-switch{display:flex;gap:6px}
.app-switch a{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;text-decoration:none;color:rgba(255,255,255,.78);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);white-space:nowrap;transition:background .12s}
.app-switch a.on{background:#fff;color:var(--toldo);border-color:#fff}
.app-switch a:hover:not(.on){background:rgba(255,255,255,.22);color:#fff}
@media (max-width:760px){
  .hd-right{width:100%;align-items:stretch}
  .app-switch{width:100%}
  .app-switch a{flex:1;justify-content:center;padding:12px 8px;font-size:13px}
  .hd-date{text-align:right;font-size:12px}
}
.hd-hoje{font-size:13px;margin-top:2px;color:#DDE8DF}
.hd-hoje b{color:#F4C566}
/* Sanefa do toldo: riscas + festão */
.awning{height:14px;background:repeating-linear-gradient(90deg,var(--toldo2) 0 36px,#fff 36px 72px);position:relative}
.awning::after{content:&quot;&quot;;position:absolute;left:0;right:0;top:14px;height:10px;
  background:radial-gradient(circle at 18px -4px, var(--toldo2) 0 17px, transparent 18px) 0 0/72px 12px repeat-x,
             radial-gradient(circle at 54px -4px, #fff 0 17px, transparent 18px) 0 0/72px 12px repeat-x;
  z-index:1100;pointer-events:none}

/* ---------- Barra de filtros ---------- */
.filters{background:var(--cartao);border-bottom:1px solid var(--linha);padding:18px 16px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:900}
.filters input[type=search]{flex:1 1 180px;min-width:150px;padding:8px 12px;border:1.5px solid var(--linha);border-radius:8px;font:inherit;font-size:14px;background:var(--papel)}
.filters select{padding:8px 10px;border:1.5px solid var(--linha);border-radius:8px;font:inherit;font-size:14px;background:var(--papel);cursor:pointer}
.filters input:focus,.filters select:focus{outline:2px solid var(--toldo2);outline-offset:1px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1.5px solid var(--linha);background:var(--papel);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--cinza)}
.chip:hover{border-color:var(--toldo2);color:var(--toldo)}
.chip.on{background:var(--toldo);border-color:var(--toldo);color:#fff}
.chip.hoje.on{background:var(--laranja);border-color:var(--laranja)}
.btn{border:none;border-radius:8px;padding:9px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn-add{background:var(--laranja);color:#fff}
.btn-add:hover{background:#d07a12}
.btn-ghost{background:transparent;color:var(--cinza);border:1.5px solid var(--linha)}
.btn-ghost:hover{color:var(--toldo);border-color:var(--toldo2)}

/* ---------- Layout principal ---------- */
main{flex:1;display:flex;min-height:0}
#lista{width:400px;max-width:45%;overflow-y:auto;border-right:1px solid var(--linha);background:var(--papel);padding:12px}
#mapa{flex:1;min-height:200px}
.count{font-size:12.5px;color:var(--cinza);margin:2px 4px 10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* ---------- Cartões ---------- */
.card{background:var(--cartao);border:1px solid var(--linha);border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;position:relative;transition:border-color .12s}
.card:hover{border-color:var(--toldo2)}
.card.sel{border-color:var(--toldo);box-shadow:0 0 0 1.5px var(--toldo)}
.card h3{font-family:&#x27;Bricolage Grotesque&#x27;,sans-serif;font-size:16px;font-weight:700;padding-right:60px;line-height:1.25}
.card .sub{font-size:13px;color:var(--cinza);margin-top:2px}
.card .quando{font-size:13.5px;margin-top:6px;font-weight:600;color:var(--toldo)}
.card .local{font-size:12.5px;color:var(--cinza);margin-top:3px}
.card .notas{font-size:12.5px;color:var(--cinza);margin-top:4px;font-style:italic}
.badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.04em}
.badge.hoje{background:var(--laranja);color:#fff}
.badge.amanha{background:#F4C566;color:#5b430a}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.card .acts{margin-top:8px;display:flex;gap:6px}
.card .acts button{font-size:12px;padding:4px 9px;border-radius:6px;border:1px solid var(--linha);background:var(--papel);cursor:pointer;color:var(--cinza)}
.card .acts button:hover{color:var(--toldo);border-color:var(--toldo2)}
.vazio{text-align:center;color:var(--cinza);padding:40px 20px;font-size:14px}
.vazio b{display:block;font-family:&#x27;Bricolage Grotesque&#x27;,sans-serif;font-size:17px;color:var(--tinta);margin-bottom:6px}

/* ---------- Popup Leaflet ---------- */
.leaflet-popup-content{font-family:&#x27;Instrument Sans&#x27;,sans-serif;font-size:13px}
.leaflet-popup-content b{font-family:&#x27;Bricolage Grotesque&#x27;,sans-serif;font-size:14.5px}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,30,24,.55);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--cartao);border-radius:14px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:22px}
.modal h2{font-family:&#x27;Bricolage Grotesque&#x27;,sans-serif;font-size:20px;margin-bottom:14px}
.modal label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;color:var(--cinza)}
.modal input[type=text],.modal input[type=number],.modal select,.modal textarea{width:100%;padding:8px 10px;border:1.5px solid var(--linha);border-radius:8px;font:inherit;font-size:14px;background:var(--papel)}
.modal textarea{resize:vertical;min-height:56px}
.diaboxes{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.diaboxes label{display:flex;align-items:center;gap:4px;border:1.5px solid var(--linha);border-radius:8px;padding:6px 9px;margin:0;cursor:pointer;font-size:13px;color:var(--tinta)}
.diaboxes input{accent-color:var(--toldo)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.hint{font-size:12px;color:var(--cinza);margin-top:4px}
.pickbtn{margin-top:6px;font-size:13px;padding:6px 10px;border-radius:8px;border:1.5px dashed var(--toldo2);background:transparent;color:var(--toldo);cursor:pointer;font-weight:600}
.picking .pickbtn{background:var(--toldo);color:#fff;border-style:solid}

/* ---------- Rodapé ---------- */
footer{background:var(--cartao);border-top:1px solid var(--linha);padding:7px 16px;font-size:11.5px;color:var(--cinza);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
footer .leg{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- Mobile ---------- */
.viewtabs{display:none}

/* ---------- Abas principais (Lista&amp;Mapa / Calendário) ---------- */
.maintabs{display:flex;gap:0;background:var(--cartao);border-bottom:1px solid var(--linha)}
.maintabs button{flex:1;max-width:220px;padding:10px 14px;font:inherit;font-size:14px;font-weight:700;border:none;background:transparent;color:var(--cinza);cursor:pointer;border-bottom:3px solid transparent;font-family:&#x27;Bricolage Grotesque&#x27;,sans-serif}
.maintabs button.on{color:var(--toldo);border-bottom-color:var(--laranja)}
body.mode-calendario main{display:none}
body.mode-calendario .viewtabs{display:none}
body:not(.mode-calendario) #calendario{display:none}

/* ---------- Calendário ---------- */
#calendario{flex:1;display:flex;min-height:0;background:var(--papel)}
#calLeft{width:440px;max-width:48%;overflow-y:auto;padding:16px 20px 30px;border-right:1px solid var(--linha)}
#mapaCal{flex:1;min-height:200px}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-titulo{font-family:&#x27;Bricolage Grotesque&#x27;,sans-serif;font-size:19px;font-weight:800;flex:1;text-align:center;text-transform:capitalize}
.cal-head .btn{padding:7px 12px}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-week{margin-bottom:6px}
.cal-week span{text-align:center;font-size:12px;font-weight:700;color:var(--cinza);text-transform:uppercase;letter-spacing:.04em}
.cal-day{background:var(--cartao);border:1.5px solid var(--linha);border-radius:9px;min-height:64px;padding:6px 6px;cursor:pointer;display:flex;flex-direction:column;gap:5px;transition:border-color .12s}
.cal-day:hover{border-color:var(--toldo2)}
.cal-day.out{opacity:.4}
.cal-day.today{border-color:var(--laranja);border-width:2px}
.cal-day.sel{box-shadow:0 0 0 2px var(--toldo) inset;border-color:var(--toldo)}
.cal-num{font-size:12.5px;font-weight:700;color:var(--tinta)}
.cal-day.today .cal-num{color:var(--laranja)}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.cal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cal-more{font-size:10.5px;font-weight:700;color:var(--cinza)}
.cal-detalhe-head{font-family:&#x27;Bricolage Grotesque&#x27;,sans-serif;font-size:17px;font-weight:700;margin:22px 0 10px;text-transform:capitalize}
#calDetalhe .card{max-width:640px}
@media (max-width:760px){
  #calendario{flex-direction:column}
  #calLeft{width:100%;max-width:100%;border-right:none;padding:12px 10px 24px}
  #mapaCal{display:none}
  .cal-day{min-height:56px;padding:4px 4px;border-radius:7px}
  .cal-num{font-size:11.5px}
  .cal-dot{width:6px;height:6px}
}

@media (max-width:760px){
  main{flex-direction:column}
  #lista{width:100%;max-width:100%;border-right:none;flex:1}
  #mapa{flex:1}
  body.v-lista #mapa{display:none}
  body.v-mapa #lista{display:none}
  .viewtabs{display:flex;gap:0;background:var(--cartao);border-bottom:1px solid var(--linha)}
  .viewtabs button{flex:1;padding:9px;font:inherit;font-size:14px;font-weight:600;border:none;background:transparent;color:var(--cinza);cursor:pointer;border-bottom:3px solid transparent}
  .viewtabs button.on{color:var(--toldo);border-bottom-color:var(--laranja)}
  footer{display:none}
}

}

/* ---------- Lógica de datas ---------- */
function ordinalDoMes(dt){return Math.ceil(dt.getDate()/7);}
function eUltimo(dt){const d=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();return dt.getDate()+7&gt;d;}
function ocorreEm(f,dt){
  const q=f.f||{}, wd=dt.getDay(), dm=dt.getDate();
  switch(q.freq){
    case &quot;diario&quot;: return true;
    case &quot;semanal&quot;: case &quot;quinzenal&quot;: return (q.dias||[]).includes(wd);
    case &quot;mensal-ordinal&quot;:
      if(q.dia!==wd) return false;
      const o=ordinalDoMes(dt);
      return (q.ordinais||[]).some(x=&gt;x===-1?eUltimo(dt):x===o);
    case &quot;mensal-data&quot;: return (q.datas||[]).includes(dm);
    default: return false;
  }
}
function textoQuando(f){
  const q=f.f||{};
  switch(q.freq){
    case &quot;diario&quot;: return &quot;Diariamente&quot;;
    case &quot;semanal&quot;: return &quot;Toda(s) a(s) &quot;+(q.dias||[]).map(d=&gt;DIAS[d]).join(&quot; e &quot;);
    case &quot;quinzenal&quot;: return &quot;Quinzenalmente à &quot;+(q.dias||[]).map(d=&gt;DIAS[d]).join(&quot; e &quot;);
    case &quot;mensal-ordinal&quot;: return (q.ordinais||[]).map(o=&gt;ORD[o]).join(&quot; e &quot;)+&quot; &quot;+DIAS[q.dia]+&quot; do mês&quot;;
    case &quot;mensal-data&quot;: return &quot;Dia&quot;+((q.datas||[]).length&gt;1?&quot;s&quot;:&quot;&quot;)+&quot; &quot;+(q.datas||[]).join(&quot;, &quot;)+&quot; de cada mês&quot;;
    case &quot;anual&quot;: return &quot;Anual — &quot;+(q.mes||&quot;&quot;);
    default: return &quot;&quot;;
  }
}

/* ---------- Estado dos filtros ---------- */
const F={busca:&quot;&quot;,distrito:&quot;&quot;,tipo:&quot;&quot;,quando:&quot;&quot;,dias:new Set()};
const hoje=new Date(); hoje.setHours(0,0,0,0);
const amanha=new Date(hoje); amanha.setDate(hoje.getDate()+1);
function proximoFDS(){
  const s=new Date(hoje), dow=hoje.getDay();
  s.setDate(hoje.getDate()+((6-dow+7)%7)); // próximo sábado (ou hoje se sábado)
  const d=new Date(s); d.setDate(s.getDate()+1);
  if(dow===0){ d.setTime(hoje.getTime()); s.setDate(hoje.getDate()+6);} // se hoje é domingo
  return [s,d];
}
function passaFiltros(f){
  if(F.busca){const t=(f.n+&quot; &quot;+f.c+&quot; &quot;+f.d+&quot; &quot;+(f.l||&quot;&quot;)+&quot; &quot;+(f.nt||&quot;&quot;)).toLowerCase(); if(!t.includes(F.busca)) return false;}
  if(F.distrito &amp;&amp; f.d!==F.distrito) return false;
  if(F.tipo &amp;&amp; f.t!==F.tipo) return false;
  if(F.dias.size){const q=f.f||{}; const ds=q.freq===&quot;mensal-ordinal&quot;?[q.dia]:(q.dias||[]); if(q.freq===&quot;diario&quot;){/*passa*/} else if(![...F.dias].some(d=&gt;ds.includes(d))) return false;}
  if(F.quando===&quot;hoje&quot; &amp;&amp; !ocorreEm(f,hoje)) return false;
  if(F.quando===&quot;amanha&quot; &amp;&amp; !ocorreEm(f,amanha)) return false;
  if(F.quando===&quot;fds&quot;){const [s,d]=proximoFDS(); if(!ocorreEm(f,s)&amp;&amp;!ocorreEm(f,d)) return false;}
  return true;
}

function esc(s){return String(s||&quot;&quot;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,m=&gt;({&quot;&amp;&quot;:&quot;&amp;amp;&quot;,&quot;&lt;&quot;:&quot;&amp;lt;&quot;,&quot;&gt;&quot;:&quot;&amp;gt;&quot;,&#x27;&quot;&#x27;:&quot;&amp;quot;&quot;,&quot;&#x27;&quot;:&quot;&amp;#39;&quot;}[m]));}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
let selId=null;

function cardHTML(f){
  const isHoje=ocorreEm(f,hoje), isAm=!isHoje&amp;&amp;ocorreEm(f,amanha);
  const badge=isHoje?&#x27;&lt;span class=&quot;badge hoje&quot;&gt;HOJE&lt;/span&gt;&#x27;:(isAm?&#x27;&lt;span class=&quot;badge amanha&quot;&gt;AMANHÃ&lt;/span&gt;&#x27;:&quot;&quot;);
  const custom=String(f.id).startsWith(&quot;c&quot;);
  return &#x27;&lt;div class=&quot;card&#x27;+(f.id===selId?&quot; sel&quot;:&quot;&quot;)+&#x27;&quot; data-id=&quot;&#x27;+f.id+&#x27;&quot;&gt;&#x27;+badge+
    &#x27;&lt;h3&gt;&lt;span class=&quot;dot&quot; style=&quot;background:&#x27;+CORES[f.t]+&#x27;&quot;&gt;&lt;/span&gt;&#x27;+esc(f.n)+&#x27;&lt;/h3&gt;&#x27;+
    &#x27;&lt;div class=&quot;sub&quot;&gt;&#x27;+esc(f.c)+&#x27; · &#x27;+esc(f.d)+&#x27; · &#x27;+TIPOS_TXT[f.t]+&#x27;&lt;/div&gt;&#x27;+
    &#x27;&lt;div class=&quot;quando&quot;&gt;&#x27;+esc(textoQuando(f))+&#x27;&lt;/div&gt;&#x27;+
    (f.l?&#x27;&lt;div class=&quot;local&quot;&gt;📍 &#x27;+esc(f.l)+&#x27;&lt;/div&gt;&#x27;:&quot;&quot;)+
    (f.nt?&#x27;&lt;div class=&quot;notas&quot;&gt;&#x27;+esc(f.nt)+&#x27;&lt;/div&gt;&#x27;:&quot;&quot;)+
    &#x27;&lt;div class=&quot;acts&quot;&gt;&lt;button data-act=&quot;edit&quot;&gt;Editar&lt;/button&gt;&lt;button data-act=&quot;del&quot;&gt;&#x27;+(custom?&quot;Apagar&quot;:&quot;Ocultar&quot;)+&#x27;&lt;/button&gt;&lt;/div&gt;&#x27;+
  &#x27;&lt;/div&gt;&#x27;;
}

function handleCardClick(e){
  const card=e.target.closest(&quot;.card&quot;); if(!card) return;
  const id=card.dataset.id;
  const act=e.target.dataset.act;
  const inCal=!!card.closest(&quot;#calDetalhe&quot;);
  if(act===&quot;edit&quot;){abrirForm(id);return;}
  if(act===&quot;del&quot;){
    if(String(id).startsWith(&quot;c&quot;)){
      if(confirm(&quot;Apagar esta entrada?&quot;)) store.custom=store.custom.filter(f=&gt;f.id!==id);
    }else{
      if(confirm(&quot;Ocultar esta feira da lista? (pode repor limpando os dados do site)&quot;)) store.hidden.push(id);
    }
    saveStore();renderAll();return;
  }
  selId=id;
  const f=allFeiras().find(x=&gt;x.id===id);
  if(f&amp;&amp;f.lat!=null&amp;&amp;f.lat!==&quot;&quot;){
    if(inCal&amp;&amp;mapCal){
      renderCalDetalhe();
      mapCal.setView([+f.lat,+f.lng],13);
      if(markersCal[id]) markersCal[id].openPopup();
    }else{
      setMode(&quot;feiras&quot;);
      render();
      map.setView([+f.lat,+f.lng],12);
      if(markers[id]) markers[id].openPopup();
      if(window.innerWidth&lt;=760){setView(&quot;mapa&quot;);}
    }
  }else{
    if(inCal) renderCalDetalhe(); else render();
  }
}

function render(){
  const list=allFeiras().filter(passaFiltros);
  // ordena: hoje primeiro, depois por distrito/nome
  list.sort((a,b)=&gt;{
    const ha=ocorreEm(a,hoje)?0:1, hb=ocorreEm(b,hoje)?0:1;
    if(ha!==hb) return ha-hb;
    return (a.d+a.n).localeCompare(b.d+b.n,&quot;pt&quot;);
  });

  // contagem cabeçalho
  const total=allFeiras(), nHoje=total.filter(f=&gt;ocorreEm(f,hoje)).length;
  document.getElementById(&quot;hdHoje&quot;).innerHTML=&quot;Hoje, &quot;+esc(DIAS[hoje.getDay()])+&quot;, há feira ou mercado em &lt;b&gt;&quot;+nHoje+&quot;&lt;/b&gt; locais registados.&quot;;
  document.getElementById(&quot;contagem&quot;).textContent=list.length+&quot; resultado&quot;+(list.length===1?&quot;&quot;:&quot;s&quot;);

  // cartões
  const wrap=document.getElementById(&quot;cards&quot;);
  if(!list.length){
    wrap.innerHTML=&#x27;&lt;div class=&quot;vazio&quot;&gt;&lt;b&gt;Sem resultados&lt;/b&gt;Ajuste os filtros ou adicione uma feira com o botão “+ Adicionar”.&lt;/div&gt;&#x27;;
  }else{
    wrap.innerHTML=list.map(cardHTML).join(&quot;&quot;);
  }

  // marcadores
  Object.values(markers).forEach(m=&gt;map.removeLayer(m)); markers={};
  list.forEach(f=&gt;{
    if(f.lat==null||f.lng==null||f.lat===&quot;&quot;) return;
    const m=L.circleMarker([+f.lat,+f.lng],{radius:8,color:&quot;#fff&quot;,weight:2,fillColor:CORES[f.t],fillOpacity:.95});
    m.bindPopup(&quot;&lt;b&gt;&quot;+esc(f.n)+&quot;&lt;/b&gt;&lt;br&gt;&quot;+esc(f.c)+&quot; · &quot;+esc(f.d)+&quot;&lt;br&gt;&lt;b style=&#x27;color:&quot;+CORES[f.t]+&quot;&#x27;&gt;&quot;+esc(textoQuando(f))+&quot;&lt;/b&gt;&quot;+(f.l?&quot;&lt;br&gt;📍 &quot;+esc(f.l):&quot;&quot;));
    m.on(&quot;click&quot;,()=&gt;{selId=f.id;render();const el=document.querySelector(&#x27;.card[data-id=&quot;&#x27;+f.id+&#x27;&quot;]&#x27;);if(el)el.scrollIntoView({block:&quot;center&quot;});m.openPopup();});
    m.addTo(map); markers[f.id]=m;
  });
}

/* ---------- Calendário ---------- */
let calYear=hoje.getFullYear(), calMonth=hoje.getMonth(), calSelDate=new Date(hoje);
function mesmoData(a,b){return a.getFullYear()===b.getFullYear()&amp;&amp;a.getMonth()===b.getMonth()&amp;&amp;a.getDate()===b.getDate();}
function passaFiltrosCal(f){
  if(F.busca){const t=(f.n+&quot; &quot;+f.c+&quot; &quot;+f.d+&quot; &quot;+(f.l||&quot;&quot;)+&quot; &quot;+(f.nt||&quot;&quot;)).toLowerCase(); if(!t.includes(F.busca)) return false;}
  if(F.distrito &amp;&amp; f.d!==F.distrito) return false;
  if(F.tipo &amp;&amp; f.t!==F.tipo) return false;
  if(F.dias.size){const q=f.f||{}; const ds=q.freq===&quot;mensal-ordinal&quot;?[q.dia]:(q.dias||[]); if(q.freq!==&quot;diario&quot; &amp;&amp; ![...F.dias].some(d=&gt;ds.includes(d))) return false;}
  return true;
}
function renderCalendario(){
  const first=new Date(calYear,calMonth,1);
  const offset=(first.getDay()+6)%7; // 0=Seg
  const start=new Date(first); start.setDate(1-offset);

  document.getElementById(&quot;calTitulo&quot;).textContent=cap(first.toLocaleDateString(&quot;pt-PT&quot;,{month:&quot;long&quot;,year:&quot;numeric&quot;}));

  let html=&quot;&quot;;
  for(let i=0;i&lt;42;i++){
    const dt=new Date(start); dt.setDate(start.getDate()+i);
    const inMonth=dt.getMonth()===calMonth;
    const list=allFeiras().filter(f=&gt;passaFiltrosCal(f)&amp;&amp;ocorreEm(f,dt));
    const dots=list.slice(0,4).map(f=&gt;&#x27;&lt;span class=&quot;cal-dot&quot; style=&quot;background:&#x27;+CORES[f.t]+&#x27;&quot;&gt;&lt;/span&gt;&#x27;).join(&quot;&quot;)+
      (list.length&gt;4?&#x27;&lt;span class=&quot;cal-more&quot;&gt;+&#x27;+(list.length-4)+&#x27;&lt;/span&gt;&#x27;:&quot;&quot;);
    html+=&#x27;&lt;div class=&quot;cal-day&#x27;+(inMonth?&quot;&quot;:&quot; out&quot;)+(mesmoData(dt,hoje)?&quot; today&quot;:&quot;&quot;)+(mesmoData(dt,calSelDate)?&quot; sel&quot;:&quot;&quot;)+&#x27;&quot; data-date=&quot;&#x27;+dt.getFullYear()+&quot;-&quot;+(dt.getMonth()+1)+&quot;-&quot;+dt.getDate()+&#x27;&quot;&gt;&#x27;+
      &#x27;&lt;span class=&quot;cal-num&quot;&gt;&#x27;+dt.getDate()+&#x27;&lt;/span&gt;&lt;div class=&quot;cal-dots&quot;&gt;&#x27;+dots+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
  }
  document.getElementById(&quot;calGrid&quot;).innerHTML=html;
  renderCalDetalhe();
}
function renderCalDetalhe(){
  const list=allFeiras().filter(f=&gt;passaFiltrosCal(f)&amp;&amp;ocorreEm(f,calSelDate))
    .sort((a,b)=&gt;(a.d+a.n).localeCompare(b.d+b.n,&quot;pt&quot;));
  calCurrentList=list;
  const titulo=cap(calSelDate.toLocaleDateString(&quot;pt-PT&quot;,{weekday:&quot;long&quot;,day:&quot;numeric&quot;,month:&quot;long&quot;}));
  let html=&#x27;&lt;div class=&quot;cal-detalhe-head&quot;&gt;&#x27;+esc(titulo)+&#x27; · &#x27;+list.length+&#x27; feira&#x27;+(list.length===1?&quot;&quot;:&quot;s&quot;)+&#x27;&lt;/div&gt;&#x27;;
  html+= list.length? list.map(cardHTML).join(&quot;&quot;) :
    &#x27;&lt;div class=&quot;vazio&quot;&gt;&lt;b&gt;Sem feiras registadas&lt;/b&gt;Experimente outro dia ou ajuste os filtros.&lt;/div&gt;&#x27;;

/* ---------- Mapa do calendário (ecrã largo) ---------- */
let mapCal=null, markersCal={}, calCurrentList=[];
function ensureCalMap(){
  if(mapCal || window.innerWidth&lt;=760) return;
  mapCal=L.map(&quot;mapaCal&quot;,{zoomControl:true}).setView([39.6,-8.0],7);
  addBase(mapCal);
  atualizarMapaCal(calCurrentList);
}
function atualizarMapaCal(list){
  if(!mapCal) return;
  Object.values(markersCal).forEach(m=&gt;mapCal.removeLayer(m)); markersCal={};
  const pts=[];
  list.forEach(f=&gt;{
    if(f.lat==null||f.lng==null||f.lat===&quot;&quot;) return;
    const m=L.circleMarker([+f.lat,+f.lng],{radius:8,color:&quot;#fff&quot;,weight:2,fillColor:CORES[f.t],fillOpacity:.95});
    m.bindPopup(&quot;&lt;b&gt;&quot;+esc(f.n)+&quot;&lt;/b&gt;&lt;br&gt;&quot;+esc(f.c)+&quot; · &quot;+esc(f.d)+&quot;&lt;br&gt;&lt;b style=&#x27;color:&quot;+CORES[f.t]+&quot;&#x27;&gt;&quot;+esc(textoQuando(f))+&quot;&lt;/b&gt;&quot;+(f.l?&quot;&lt;br&gt;📍 &quot;+esc(f.l):&quot;&quot;));
    m.addTo(mapCal); markersCal[f.id]=m;
    pts.push([+f.lat,+f.lng]);
  });
  if(pts.length===1) mapCal.setView(pts[0],12);
  else if(pts.length&gt;1) mapCal.fitBounds(pts,{padding:[30,30],maxZoom:11});
  else mapCal.setView([39.6,-8.0],7);
}

function abrirForm(id){
  editId=id||null;
  document.getElementById(&quot;mTitulo&quot;).textContent=editId?&quot;Editar feira ou mercado&quot;:&quot;Adicionar feira ou mercado&quot;;
  const f=editId?allFeiras().find(x=&gt;x.id===editId):null;
  document.getElementById(&quot;mNome&quot;).value=f?f.n:&quot;&quot;;
  document.getElementById(&quot;mConcelho&quot;).value=f?f.c:&quot;&quot;;
  selMD.value=f?f.d:&quot;Lisboa&quot;;
  document.getElementById(&quot;mTipo&quot;).value=f?f.t:&quot;semanal&quot;;
  document.getElementById(&quot;mFreq&quot;).value=f?(f.f||{}).freq||&quot;semanal&quot;:&quot;semanal&quot;;
  document.querySelectorAll(&quot;#mDias input&quot;).forEach(cb=&gt;cb.checked=f&amp;&amp;(f.f.dias||[]).includes(+cb.value));
  document.querySelectorAll(&quot;#mOrdinais input&quot;).forEach(cb=&gt;cb.checked=f&amp;&amp;(f.f.ordinais||[]).includes(+cb.value));
  document.getElementById(&quot;mOrdDia&quot;).value=f&amp;&amp;f.f.dia!=null?f.f.dia:6;
  document.getElementById(&quot;mDatas&quot;).value=f&amp;&amp;f.f.datas?f.f.datas.join(&quot;, &quot;):&quot;&quot;;
  document.getElementById(&quot;mMes&quot;).value=f&amp;&amp;f.f.mes?f.f.mes:&quot;&quot;;
  document.getElementById(&quot;mLocal&quot;).value=f?(f.l||&quot;&quot;):&quot;&quot;;
  document.getElementById(&quot;mNotas&quot;).value=f?(f.nt||&quot;&quot;):&quot;&quot;;
  document.getElementById(&quot;mLat&quot;).value=f&amp;&amp;f.lat!=null?f.lat:&quot;&quot;;

  ov.classList.add(&quot;open&quot;);

document.getElementById(&quot;mSave&quot;).addEventListener(&quot;click&quot;,()=&gt;{
  const n=document.getElementById(&quot;mNome&quot;).value.trim();
  const c=document.getElementById(&quot;mConcelho&quot;).value.trim();
  if(!n||!c){alert(&quot;Preencha o nome e o concelho.&quot;);return;}
  const fr=document.getElementById(&quot;mFreq&quot;).value;
  const fq={freq:fr};
  if(fr===&quot;semanal&quot;||fr===&quot;quinzenal&quot;){
    fq.dias=[...document.querySelectorAll(&quot;#mDias input:checked&quot;)].map(cb=&gt;+cb.value);
    if(!fq.dias.length){alert(&quot;Escolha pelo menos um dia da semana.&quot;);return;}
  }else if(fr===&quot;mensal-ordinal&quot;){
    fq.ordinais=[...document.querySelectorAll(&quot;#mOrdinais input:checked&quot;)].map(cb=&gt;+cb.value);
    fq.dia=+document.getElementById(&quot;mOrdDia&quot;).value;
    if(!fq.ordinais.length){alert(&quot;Escolha pelo menos uma ocorrência (1.º, 2.º…).&quot;);return;}
  }else if(fr===&quot;mensal-data&quot;){
    fq.datas=document.getElementById(&quot;mDatas&quot;).value.split(&quot;,&quot;).map(s=&gt;+s.trim()).filter(x=&gt;x&gt;=1&amp;&amp;x&lt;=31);
    if(!fq.datas.length){alert(&quot;Indique pelo menos um dia do mês (1–31).&quot;);return;}
  }else if(fr===&quot;anual&quot;){
    fq.mes=document.getElementById(&quot;mMes&quot;).value.trim();
  }
  const latV=document.getElementById(&quot;mLat&quot;).value, lngV=document.getElementById(&quot;mLng&quot;).value;
  const obj={n:n,c:c,d:selMD.value,t:document.getElementById(&quot;mTipo&quot;).value,f:fq,
    l:document.getElementById(&quot;mLocal&quot;).value.trim(),nt:document.getElementById(&quot;mNotas&quot;).value.trim(),
    lat:latV===&quot;&quot;?null:+latV,lng:lngV===&quot;&quot;?null:+lngV};
  if(editId){
    if(String(editId).startsWith(&quot;c&quot;)){
      const i=store.custom.findIndex(x=&gt;x.id===editId);
      store.custom[i]=Object.assign({id:editId},obj);
    }else{
      store.overrides[editId]=obj;
    }
  }else{
    obj.id=&quot;c&quot;+Date.now();
    store.custom.push(obj);
  }
  saveStore();
  ov.classList.remove(&quot;open&quot;);
  selId=editId||obj.id;
  renderAll();
});

.modal h2{font-family:&#x27;Bricolage Grotesque&#x27;,sans-serif;font-size:20px;margin-bottom:14px}
.modal label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;color:var(--cinza)}
.modal input[type=text],.modal input[type=date],.modal input[type=number],.modal select,.modal textarea{width:100%;padding:8px 10px;border:1.5px solid var(--linha);border-radius:8px;font:inherit;font-size:14px;background:var(--papel)}
.modal textarea{resize:vertical;min-height:56px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.hint{font-size:12px;color:var(--cinza);margin-top:4px}
.pickbtn{margin-top:6px;font-size:13px;padding:6px 10px;border-radius:8px;border:1.5px dashed var(--vinho2);background:transparent;color:var(--vinho);cursor:pointer;font-weight:600}
.picking .pickbtn{background:var(--vinho);color:#fff;border-style:solid}

/* ---------- Calendário ---------- */
#calendario{flex:1;display:flex;min-height:0;background:var(--papel)}
#calLeft{width:440px;max-width:48%;overflow-y:auto;padding:16px 20px 30px;border-right:1px solid var(--linha)}
#mapaCal{flex:1;min-height:200px}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-titulo{font-family:&#x27;Bricolage Grotesque&#x27;,sans-serif;font-size:19px;font-weight:800;flex:1;text-align:center;text-transform:capitalize}
.cal-head .btn{padding:7px 12px}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-week{margin-bottom:6px}
.cal-week span{text-align:center;font-size:12px;font-weight:700;color:var(--cinza);text-transform:uppercase;letter-spacing:.04em}
.cal-day{background:var(--cartao);border:1.5px solid var(--linha);border-radius:9px;min-height:64px;padding:6px 6px;cursor:pointer;display:flex;flex-direction:column;gap:5px;transition:border-color .12s}
.cal-day:hover{border-color:var(--vinho2)}
.cal-day.out{opacity:.4}
.cal-day.today{border-color:var(--dourado);border-width:2px}
.cal-day.sel{box-shadow:0 0 0 2px var(--vinho) inset;border-color:var(--vinho)}
.cal-num{font-size:12.5px;font-weight:700;color:var(--tinta)}
.cal-day.today .cal-num{color:#a3760f}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.cal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cal-more{font-size:10.5px;font-weight:700;color:var(--cinza)}
.cal-detalhe-head{font-family:&#x27;Bricolage Grotesque&#x27;,sans-serif;font-size:17px;font-weight:700;margin:22px 0 10px;text-transform:capitalize}
#calDetalhe .card{max-width:640px}

/* ---------- Rodapé ---------- */
footer{background:var(--cartao);border-top:1px solid var(--linha);padding:7px 16px;font-size:11.5px;color:var(--cinza);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
footer .leg{display:flex;gap:12px;flex-wrap:wrap}
footer a{color:var(--vinho);font-weight:700;text-decoration:none}
footer a:hover{text-decoration:underline}

/* ---------- Mobile ---------- */
.viewtabs{display:none}
@media (max-width:760px){
  main{flex-direction:column}
  #lista{width:100%;max-width:100%;border-right:none;flex:1}
  #mapa{flex:1}
  body.v-lista #mapa{display:none}
  body.v-mapa #lista{display:none}
  .viewtabs{display:flex;gap:0;background:var(--cartao);border-bottom:1px solid var(--linha)}
  .viewtabs button{flex:1;padding:9px;font:inherit;font-size:14px;font-weight:600;border:none;background:transparent;color:var(--cinza);cursor:pointer;border-bottom:3px solid transparent}
  .viewtabs button.on{color:var(--vinho);border-bottom-color:var(--dourado)}
  footer{display:none}
  #calendario{flex-direction:column}
  #calLeft{width:100%;max-width:100%;border-right:none;padding:12px 10px 24px}
  #mapaCal{display:none}
  .cal-day{min-height:56px;padding:4px 4px;border-radius:7px}
  .cal-num{font-size:11.5px}
  .cal-dot{width:6px;height:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const MESES=[&quot;janeiro&quot;,&quot;fevereiro&quot;,&quot;março&quot;,&quot;abril&quot;,&quot;maio&quot;,&quot;junho&quot;,&quot;julho&quot;,&quot;agosto&quot;,&quot;setembro&quot;,&quot;outubro&quot;,&quot;novembro&quot;,&quot;dezembro&quot;];
const MESES_C=[&quot;Jan&quot;,&quot;Fev&quot;,&quot;Mar&quot;,&quot;Abr&quot;,&quot;Mai&quot;,&quot;Jun&quot;,&quot;Jul&quot;,&quot;Ago&quot;,&quot;Set&quot;,&quot;Out&quot;,&quot;Nov&quot;,&quot;Dez&quot;];
const CORES={romaria:&quot;#7A1B2B&quot;,popular:&quot;#D89B2B&quot;,carnaval:&quot;#7B4B94&quot;,academica:&quot;#2F6690&quot;,taurina:&quot;#B85C2E&quot;};
const TIPOS_TXT={romaria:&quot;Romaria&quot;,popular:&quot;Festa popular&quot;,carnaval:&quot;Carnaval&quot;,academica:&quot;Festa académica&quot;,taurina:&quot;Festa taurina&quot;};
const LS_KEY=&quot;romariasPT_v1&quot;;

/* ---------- Persistência ---------- */
let store={custom:[],overrides:{},hidden:[]};
try{const s=localStorage.getItem(LS_KEY); if(s) store=Object.assign(store,JSON.parse(s));}catch(e){}
function saveStore(){try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){alert(&quot;Não foi possível guardar (localStorage indisponível).&quot;);}}

function allFestas(){
  const base=BASE.filter(f=&gt;!store.hidden.includes(f.id)).map(f=&gt;store.overrides[f.id]?Object.assign({},f,store.overrides[f.id]):f);
  return base.concat(store.custom);
}

/* ---------- Lógica de datas ---------- */
function dataSo(iso){return new Date(iso+&quot;T00:00:00&quot;);}
function ocorreEm(f,dt){
  const t=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()).getTime();
  return t&gt;=dataSo(f.ini).getTime() &amp;&amp; t&lt;=dataSo(f.fim).getTime();
}
function textoQuando(f){
  const a=dataSo(f.ini), b=dataSo(f.fim);
  if(a.getTime()===b.getTime()) return a.getDate()+&quot; de &quot;+MESES[a.getMonth()];
  if(a.getMonth()===b.getMonth()&amp;&amp;a.getFullYear()===b.getFullYear()) return a.getDate()+&quot; a &quot;+b.getDate()+&quot; de &quot;+MESES[a.getMonth()];
  return a.getDate()+&quot; de &quot;+MESES[a.getMonth()]+&quot; a &quot;+b.getDate()+&quot; de &quot;+MESES[b.getMonth()];
}
function mesesDaFesta(f){
  const a=dataSo(f.ini), b=dataSo(f.fim), ms=new Set();
  let cur=new Date(a.getFullYear(),a.getMonth(),1);
  while(cur&lt;=b){ ms.add(cur.getMonth()); cur.setMonth(cur.getMonth()+1); }
  return ms;
}
function diasParaInicio(f){ return Math.round((dataSo(f.ini)-hoje)/86400000); }

/* ---------- Estado dos filtros ---------- */
const F={busca:&quot;&quot;,distrito:&quot;&quot;,tipo:&quot;&quot;,quando:&quot;&quot;,meses:new Set()};
const hoje=new Date(); hoje.setHours(0,0,0,0);
function passaFiltrosBase(f){
  if(F.busca){const t=(f.n+&quot; &quot;+f.c+&quot; &quot;+f.d+&quot; &quot;+(f.l||&quot;&quot;)+&quot; &quot;+(f.nt||&quot;&quot;)).toLowerCase(); if(!t.includes(F.busca)) return false;}
  if(F.distrito &amp;&amp; f.d!==F.distrito) return false;
  if(F.tipo &amp;&amp; f.t!==F.tipo) return false;
  if(F.meses.size){ const ms=mesesDaFesta(f); if(![...F.meses].some(m=&gt;ms.has(m))) return false; }
  return true;
}
function passaFiltros(f){
  if(!passaFiltrosBase(f)) return false;
  if(F.quando===&quot;hoje&quot; &amp;&amp; !ocorreEm(f,hoje)) return false;
  if(F.quando===&quot;mes&quot;){ if(!mesesDaFesta(f).has(hoje.getMonth())) return false; }
  if(F.quando===&quot;30dias&quot;){
    const a=dataSo(f.ini).getTime(), b=dataSo(f.fim).getTime();
    const h=hoje.getTime(), h30=h+30*86400000;
    if(!(a&lt;=h30 &amp;&amp; b&gt;=h)) return false;
  }
  return true;
}

/* ---------- Mapa base (sem chave de API) ---------- */
function addBase(m){
  L.tileLayer(&quot;https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}&quot;,{attribution:&#x27;Tiles &amp;copy; Esri &amp;mdash; Esri, DeLorme, NAVTEQ, OpenStreetMap contributors&#x27;,maxNativeZoom:17,maxZoom:19}).addTo(m);
}
const map=L.map(&quot;mapa&quot;,{zoomControl:true}).setView([39.6,-8.0],7);
addBase(map);
let markers={};
let picking=false;

map.on(&quot;click&quot;,e=&gt;{
  if(!picking) return;
  document.getElementById(&quot;mLat&quot;).value=e.latlng.lat.toFixed(5);
  document.getElementById(&quot;mLng&quot;).value=e.latlng.lng.toFixed(5);
  picking=false; document.body.classList.remove(&quot;picking&quot;);
  document.getElementById(&quot;ovForm&quot;).classList.add(&quot;open&quot;);
});

/* ---------- Render ---------- */
function esc(s){return String(s||&quot;&quot;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,m=&gt;({&quot;&amp;&quot;:&quot;&amp;amp;&quot;,&quot;&lt;&quot;:&quot;&amp;lt;&quot;,&quot;&gt;&quot;:&quot;&amp;gt;&quot;,&#x27;&quot;&#x27;:&quot;&amp;quot;&quot;,&quot;&#x27;&quot;:&quot;&amp;#39;&quot;}[m]));}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
let selId=null;

function cardHTML(f){
  const decorrendo=ocorreEm(f,hoje), dias=diasParaInicio(f);
  const badge=decorrendo?&#x27;&lt;span class=&quot;badge hoje&quot;&gt;A DECORRER&lt;/span&gt;&#x27;:(dias&gt;0&amp;&amp;dias&lt;=14?&#x27;&lt;span class=&quot;badge breve&quot;&gt;EM BREVE&lt;/span&gt;&#x27;:&quot;&quot;);
  const custom=String(f.id).startsWith(&quot;c&quot;);
  return &#x27;&lt;div class=&quot;card&#x27;+(f.id===selId?&quot; sel&quot;:&quot;&quot;)+&#x27;&quot; data-id=&quot;&#x27;+f.id+&#x27;&quot;&gt;&#x27;+badge+
    &#x27;&lt;h3&gt;&lt;span class=&quot;dot&quot; style=&quot;background:&#x27;+CORES[f.t]+&#x27;&quot;&gt;&lt;/span&gt;&#x27;+esc(f.n)+&#x27;&lt;/h3&gt;&#x27;+
    &#x27;&lt;div class=&quot;sub&quot;&gt;&#x27;+esc(f.c)+(f.d?&#x27; · &#x27;+esc(f.d):&#x27;&#x27;)+&#x27; · &#x27;+TIPOS_TXT[f.t]+&#x27;&lt;/div&gt;&#x27;+
    &#x27;&lt;div class=&quot;quando&quot;&gt;&#x27;+esc(textoQuando(f))+&#x27;&lt;/div&gt;&#x27;+
    (f.l?&#x27;&lt;div class=&quot;local&quot;&gt;📍 &#x27;+esc(f.l)+&#x27;&lt;/div&gt;&#x27;:&quot;&quot;)+
    (f.nt?&#x27;&lt;div class=&quot;notas&quot;&gt;&#x27;+esc(f.nt)+&#x27;&lt;/div&gt;&#x27;:&quot;&quot;)+
    &#x27;&lt;div class=&quot;acts&quot;&gt;&lt;button data-act=&quot;edit&quot;&gt;Editar&lt;/button&gt;&lt;button data-act=&quot;del&quot;&gt;&#x27;+(custom?&quot;Apagar&quot;:&quot;Ocultar&quot;)+&#x27;&lt;/button&gt;&lt;/div&gt;&#x27;+
  &#x27;&lt;/div&gt;&#x27;;
}

function handleCardClick(e){
  const card=e.target.closest(&quot;.card&quot;); if(!card) return;
  const id=card.dataset.id;
  const act=e.target.dataset.act;
  const inCal=!!card.closest(&quot;#calDetalhe&quot;);
  if(act===&quot;edit&quot;){abrirForm(id);return;}
  if(act===&quot;del&quot;){
    if(String(id).startsWith(&quot;c&quot;)){
      if(confirm(&quot;Apagar esta entrada?&quot;)) store.custom=store.custom.filter(f=&gt;f.id!==id);
    }else{
      if(confirm(&quot;Ocultar esta festa da lista? (pode repor limpando os dados do site)&quot;)) store.hidden.push(id);
    }
    saveStore();renderAll();return;
  }
  selId=id;
  const f=allFestas().find(x=&gt;x.id===id);
  if(f&amp;&amp;f.lat!=null&amp;&amp;f.lat!==&quot;&quot;){
    if(inCal&amp;&amp;mapCal){
      renderCalDetalhe();
      mapCal.setView([+f.lat,+f.lng],12);
      if(markersCal[id]) markersCal[id].openPopup();
    }else{
      setMode(&quot;feiras&quot;);
      render();
      map.setView([+f.lat,+f.lng],11);
      if(markers[id]) markers[id].openPopup();
      if(window.innerWidth&lt;=760){setView(&quot;mapa&quot;);}
    }
  }else{
    if(inCal) renderCalDetalhe(); else render();
  }
}

function render(){
  const list=allFestas().filter(passaFiltros);
  list.sort((a,b)=&gt;{
    const oa=ocorreEm(a,hoje)?0:1, ob=ocorreEm(b,hoje)?0:1;
    if(oa!==ob) return oa-ob;
    return dataSo(a.ini)-dataSo(b.ini);
  });

  const total=allFestas(), ocorrem=total.filter(f=&gt;ocorreEm(f,hoje));
  if(ocorrem.length){
    document.getElementById(&quot;hdHoje&quot;).innerHTML=&quot;Hoje, &quot;+esc(hoje.toLocaleDateString(&quot;pt-PT&quot;,{weekday:&quot;long&quot;}))+&quot;, há festa ou romaria a decorrer em &lt;b&gt;&quot;+ocorrem.length+&quot;&lt;/b&gt; local&quot;+(ocorrem.length===1?&quot;&quot;:&quot;is&quot;)+&quot;.&quot;;
  }else{
    const futuras=total.filter(f=&gt;diasParaInicio(f)&gt;0).sort((a,b)=&gt;diasParaInicio(a)-diasParaInicio(b));
    document.getElementById(&quot;hdHoje&quot;).innerHTML=futuras.length? &quot;Hoje não há festas a decorrer. A próxima é &lt;b&gt;&quot;+esc(futuras[0].n)+&quot;&lt;/b&gt;, a &quot;+esc(textoQuando(futuras[0]))+&quot;.&quot; : &quot;Hoje não há festas registadas a decorrer.&quot;;
  }
  document.getElementById(&quot;contagem&quot;).textContent=list.length+&quot; resultado&quot;+(list.length===1?&quot;&quot;:&quot;s&quot;);

  const wrap=document.getElementById(&quot;cards&quot;);
  wrap.innerHTML=list.length? list.map(cardHTML).join(&quot;&quot;) :
    &#x27;&lt;div class=&quot;vazio&quot;&gt;&lt;b&gt;Sem resultados&lt;/b&gt;Ajuste os filtros ou adicione uma festa com o botão “+ Adicionar”.&lt;/div&gt;&#x27;;

  Object.values(markers).forEach(m=&gt;map.removeLayer(m)); markers={};
  list.forEach(f=&gt;{
    if(f.lat==null||f.lng==null||f.lat===&quot;&quot;) return;
    const m=L.circleMarker([+f.lat,+f.lng],{radius:8,color:&quot;#fff&quot;,weight:2,fillColor:CORES[f.t],fillOpacity:.95});
    m.bindPopup(&quot;&lt;b&gt;&quot;+esc(f.n)+&quot;&lt;/b&gt;&lt;br&gt;&quot;+esc(f.c)+&quot; · &quot;+esc(f.d)+&quot;&lt;br&gt;&lt;b style=&#x27;color:&quot;+CORES[f.t]+&quot;&#x27;&gt;&quot;+esc(textoQuando(f))+&quot;&lt;/b&gt;&quot;+(f.l?&quot;&lt;br&gt;📍 &quot;+esc(f.l):&quot;&quot;));
    m.on(&quot;click&quot;,()=&gt;{selId=f.id;render();const el=document.querySelector(&#x27;.card[data-id=&quot;&#x27;+f.id+&#x27;&quot;]&#x27;);if(el)el.scrollIntoView({block:&quot;center&quot;});m.openPopup();});
    m.addTo(map); markers[f.id]=m;
  });
}

/* ---------- Calendário ---------- */
let calYear=hoje.getFullYear(), calMonth=hoje.getMonth(), calSelDate=new Date(hoje);
function mesmoData(a,b){return a.getFullYear()===b.getFullYear()&amp;&amp;a.getMonth()===b.getMonth()&amp;&amp;a.getDate()===b.getDate();}
function renderCalendario(){
  const first=new Date(calYear,calMonth,1);
  const offset=(first.getDay()+6)%7;
  const start=new Date(first); start.setDate(1-offset);

  document.getElementById(&quot;calTitulo&quot;).textContent=cap(first.toLocaleDateString(&quot;pt-PT&quot;,{month:&quot;long&quot;,year:&quot;numeric&quot;}));

  let html=&quot;&quot;;
  for(let i=0;i&lt;42;i++){
    const dt=new Date(start); dt.setDate(start.getDate()+i);
    const inMonth=dt.getMonth()===calMonth;
    const list=allFestas().filter(f=&gt;passaFiltrosBase(f)&amp;&amp;ocorreEm(f,dt));
    const dots=list.slice(0,4).map(f=&gt;&#x27;&lt;span class=&quot;cal-dot&quot; style=&quot;background:&#x27;+CORES[f.t]+&#x27;&quot;&gt;&lt;/span&gt;&#x27;).join(&quot;&quot;)+
      (list.length&gt;4?&#x27;&lt;span class=&quot;cal-more&quot;&gt;+&#x27;+(list.length-4)+&#x27;&lt;/span&gt;&#x27;:&quot;&quot;);
    html+=&#x27;&lt;div class=&quot;cal-day&#x27;+(inMonth?&quot;&quot;:&quot; out&quot;)+(mesmoData(dt,hoje)?&quot; today&quot;:&quot;&quot;)+(mesmoData(dt,calSelDate)?&quot; sel&quot;:&quot;&quot;)+&#x27;&quot; data-date=&quot;&#x27;+dt.getFullYear()+&quot;-&quot;+(dt.getMonth()+1)+&quot;-&quot;+dt.getDate()+&#x27;&quot;&gt;&#x27;+
      &#x27;&lt;span class=&quot;cal-num&quot;&gt;&#x27;+dt.getDate()+&#x27;&lt;/span&gt;&lt;div class=&quot;cal-dots&quot;&gt;&#x27;+dots+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
  }
  document.getElementById(&quot;calGrid&quot;).innerHTML=html;
  renderCalDetalhe();
}
function renderCalDetalhe(){
  const list=allFestas().filter(f=&gt;passaFiltrosBase(f)&amp;&amp;ocorreEm(f,calSelDate))
    .sort((a,b)=&gt;(a.d+a.n).localeCompare(b.d+b.n,&quot;pt&quot;));
  calCurrentList=list;
  const titulo=cap(calSelDate.toLocaleDateString(&quot;pt-PT&quot;,{weekday:&quot;long&quot;,day:&quot;numeric&quot;,month:&quot;long&quot;}));
  let html=&#x27;&lt;div class=&quot;cal-detalhe-head&quot;&gt;&#x27;+esc(titulo)+&#x27; · &#x27;+list.length+&#x27; festa&#x27;+(list.length===1?&quot;&quot;:&quot;s&quot;)+&#x27;&lt;/div&gt;&#x27;;
  html+= list.length? list.map(cardHTML).join(&quot;&quot;) :
    &#x27;&lt;div class=&quot;vazio&quot;&gt;&lt;b&gt;Sem festas registadas&lt;/b&gt;Experimente outro dia ou ajuste os filtros.&lt;/div&gt;&#x27;;
  document.getElementById(&quot;calDetalhe&quot;).innerHTML=html;
  atualizarMapaCal(list);
}

/* ---------- Mapa do calendário (ecrã largo) ---------- */
let mapCal=null, markersCal={}, calCurrentList=[];
function ensureCalMap(){
  if(mapCal || window.innerWidth&lt;=760) return;
  mapCal=L.map(&quot;mapaCal&quot;,{zoomControl:true}).setView([39.6,-8.0],7);
  addBase(mapCal);
  atualizarMapaCal(calCurrentList);
}
function atualizarMapaCal(list){
  if(!mapCal) return;
  Object.values(markersCal).forEach(m=&gt;mapCal.removeLayer(m)); markersCal={};
  const pts=[];
  list.forEach(f=&gt;{
    if(f.lat==null||f.lng==null||f.lat===&quot;&quot;) return;
    const m=L.circleMarker([+f.lat,+f.lng],{radius:8,color:&quot;#fff&quot;,weight:2,fillColor:CORES[f.t],fillOpacity:.95});
    m.bindPopup(&quot;&lt;b&gt;&quot;+esc(f.n)+&quot;&lt;/b&gt;&lt;br&gt;&quot;+esc(f.c)+&quot; · &quot;+esc(f.d)+&quot;&lt;br&gt;&lt;b style=&#x27;color:&quot;+CORES[f.t]+&quot;&#x27;&gt;&quot;+esc(textoQuando(f))+&quot;&lt;/b&gt;&quot;+(f.l?&quot;&lt;br&gt;📍 &quot;+esc(f.l):&quot;&quot;));
    m.addTo(mapCal); markersCal[f.id]=m;
    pts.push([+f.lat,+f.lng]);
  });
  if(pts.length===1) mapCal.setView(pts[0],11);
  else if(pts.length&gt;1) mapCal.fitBounds(pts,{padding:[30,30],maxZoom:11});
  else mapCal.setView([39.6,-8.0],7);
}

document.getElementById(&quot;calGrid&quot;).addEventListener(&quot;click&quot;,e=&gt;{
  const cell=e.target.closest(&quot;.cal-day&quot;); if(!cell) return;
  const [y,m,d]=cell.dataset.date.split(&quot;-&quot;).map(Number);
  calSelDate=new Date(y,m-1,d);
  renderCalendario();
});
document.getElementById(&quot;calDetalhe&quot;).addEventListener(&quot;click&quot;,handleCardClick);
document.getElementById(&quot;calPrev&quot;).addEventListener(&quot;click&quot;,()=&gt;{calMonth--;if(calMonth&lt;0){calMonth=11;calYear--;}renderCalendario();});
document.getElementById(&quot;calNext&quot;).addEventListener(&quot;click&quot;,()=&gt;{calMonth++;if(calMonth&gt;11){calMonth=0;calYear++;}renderCalendario();});
document.getElementById(&quot;calHoje&quot;).addEventListener(&quot;click&quot;,()=&gt;{calYear=hoje.getFullYear();calMonth=hoje.getMonth();calSelDate=new Date(hoje);renderCalendario();});

function renderAll(){render();renderCalendario();}

/* ---------- Abas principais ---------- */
function setMode(m){
  document.body.classList.toggle(&quot;mode-calendario&quot;,m===&quot;calendario&quot;);
  document.getElementById(&quot;tabFeiras&quot;).classList.toggle(&quot;on&quot;,m===&quot;feiras&quot;);
  document.getElementById(&quot;tabCal&quot;).classList.toggle(&quot;on&quot;,m===&quot;calendario&quot;);
  if(m===&quot;feiras&quot;) setTimeout(()=&gt;map.invalidateSize(),60);
  if(m===&quot;calendario&quot;){
    ensureCalMap();
    setTimeout(()=&gt;{ if(mapCal) mapCal.invalidateSize(); },60);
  }
}
window.addEventListener(&quot;resize&quot;,()=&gt;{
  if(document.body.classList.contains(&quot;mode-calendario&quot;)){
    ensureCalMap();
    if(mapCal) mapCal.invalidateSize();
  }
});
document.getElementById(&quot;tabFeiras&quot;).addEventListener(&quot;click&quot;,()=&gt;setMode(&quot;feiras&quot;));
document.getElementById(&quot;tabCal&quot;).addEventListener(&quot;click&quot;,()=&gt;setMode(&quot;calendario&quot;));

/* ---------- Interações da lista ---------- */
document.getElementById(&quot;cards&quot;).addEventListener(&quot;click&quot;,handleCardClick);

/* ---------- Filtros ---------- */
document.getElementById(&quot;fBusca&quot;).addEventListener(&quot;input&quot;,e=&gt;{F.busca=e.target.value.trim().toLowerCase();renderAll();});
const selD=document.getElementById(&quot;fDistrito&quot;);
DISTRITOS.forEach(d=&gt;{const o=document.createElement(&quot;option&quot;);o.value=d;o.textContent=d;selD.appendChild(o);});
selD.addEventListener(&quot;change&quot;,e=&gt;{F.distrito=e.target.value;renderAll();});
document.getElementById(&quot;fTipo&quot;).addEventListener(&quot;change&quot;,e=&gt;{F.tipo=e.target.value;renderAll();});
document.getElementById(&quot;chipsQuando&quot;).addEventListener(&quot;click&quot;,e=&gt;{
  const b=e.target.closest(&quot;.chip&quot;); if(!b) return;
  const q=b.dataset.q;
  F.quando=(F.quando===q)?&quot;&quot;:q;
  document.querySelectorAll(&quot;#chipsQuando .chip&quot;).forEach(c=&gt;c.classList.toggle(&quot;on&quot;,c.dataset.q===F.quando));
  render();
});
document.getElementById(&quot;chipsMes&quot;).addEventListener(&quot;click&quot;,e=&gt;{
  const b=e.target.closest(&quot;.chip&quot;); if(!b) return;
  const m=+b.dataset.m;
  if(F.meses.has(m)){F.meses.delete(m);b.classList.remove(&quot;on&quot;);}else{F.meses.add(m);b.classList.add(&quot;on&quot;);}
  renderAll();
});
document.getElementById(&quot;btnLimpar&quot;).addEventListener(&quot;click&quot;,()=&gt;{
  F.busca=&quot;&quot;;F.distrito=&quot;&quot;;F.tipo=&quot;&quot;;F.quando=&quot;&quot;;F.meses.clear();
  document.getElementById(&quot;fBusca&quot;).value=&quot;&quot;;selD.value=&quot;&quot;;document.getElementById(&quot;fTipo&quot;).value=&quot;&quot;;
  document.querySelectorAll(&quot;.chip&quot;).forEach(c=&gt;c.classList.remove(&quot;on&quot;));
  renderAll();
});

/* ---------- Formulário ---------- */
const ov=document.getElementById(&quot;ovForm&quot;);
let editId=null;
const selMD=document.getElementById(&quot;mDistrito&quot;);
DISTRITOS.forEach(d=&gt;{const o=document.createElement(&quot;option&quot;);o.value=d;o.textContent=d;selMD.appendChild(o);});

function abrirForm(id){
  editId=id||null;
  document.getElementById(&quot;mTitulo&quot;).textContent=editId?&quot;Editar festa ou romaria&quot;:&quot;Adicionar festa ou romaria&quot;;
  const f=editId?allFestas().find(x=&gt;x.id===editId):null;
  document.getElementById(&quot;mNome&quot;).value=f?f.n:&quot;&quot;;
  document.getElementById(&quot;mConcelho&quot;).value=f?f.c:&quot;&quot;;
  selMD.value=f?f.d:&quot;Lisboa&quot;;
  document.getElementById(&quot;mTipo&quot;).value=f?f.t:&quot;popular&quot;;
  document.getElementById(&quot;mIni&quot;).value=f?f.ini:&quot;&quot;;
  document.getElementById(&quot;mFim&quot;).value=f?f.fim:&quot;&quot;;
  document.getElementById(&quot;mLocal&quot;).value=f?(f.l||&quot;&quot;):&quot;&quot;;
  document.getElementById(&quot;mNotas&quot;).value=f?(f.nt||&quot;&quot;):&quot;&quot;;
  document.getElementById(&quot;mLat&quot;).value=f&amp;&amp;f.lat!=null?f.lat:&quot;&quot;;
  document.getElementById(&quot;mLng&quot;).value=f&amp;&amp;f.lng!=null?f.lng:&quot;&quot;;
  ov.classList.add(&quot;open&quot;);
}
document.getElementById(&quot;btnAdd&quot;).addEventListener(&quot;click&quot;,()=&gt;abrirForm(null));
document.getElementById(&quot;mCancel&quot;).addEventListener(&quot;click&quot;,()=&gt;{ov.classList.remove(&quot;open&quot;);picking=false;document.body.classList.remove(&quot;picking&quot;);});
ov.addEventListener(&quot;click&quot;,e=&gt;{if(e.target===ov){ov.classList.remove(&quot;open&quot;);}});

document.getElementById(&quot;btnPick&quot;).addEventListener(&quot;click&quot;,()=&gt;{
  picking=true;document.body.classList.add(&quot;picking&quot;);
  ov.classList.remove(&quot;open&quot;);
  if(window.innerWidth&lt;=760) setView(&quot;mapa&quot;);
  alert(&quot;Clique no mapa no local da festa. O formulário volta a abrir com as coordenadas preenchidas.&quot;);
});

document.getElementById(&quot;mSave&quot;).addEventListener(&quot;click&quot;,()=&gt;{
  const n=document.getElementById(&quot;mNome&quot;).value.trim();
  const c=document.getElementById(&quot;mConcelho&quot;).value.trim();
  const ini=document.getElementById(&quot;mIni&quot;).value;
  const fim=document.getElementById(&quot;mFim&quot;).value||ini;
  if(!n||!c){alert(&quot;Preencha o nome e o concelho.&quot;);return;}
  if(!ini){alert(&quot;Indique a data de início.&quot;);return;}
  if(fim&lt;ini){alert(&quot;A data de fim não pode ser anterior à data de início.&quot;);return;}
  const latV=document.getElementById(&quot;mLat&quot;).value, lngV=document.getElementById(&quot;mLng&quot;).value;
  const obj={n:n,c:c,d:selMD.value,t:document.getElementById(&quot;mTipo&quot;).value,ini:ini,fim:fim,
    l:document.getElementById(&quot;mLocal&quot;).value.trim(),nt:document.getElementById(&quot;mNotas&quot;).value.trim(),
    lat:latV===&quot;&quot;?null:+latV,lng:lngV===&quot;&quot;?null:+lngV};
  if(editId){
    if(String(editId).startsWith(&quot;c&quot;)){
      const i=store.custom.findIndex(x=&gt;x.id===editId);
      store.custom[i]=Object.assign({id:editId},obj);
    }else{
      store.overrides[editId]=obj;
    }
  }else{
    obj.id=&quot;c&quot;+Date.now();
    store.custom.push(obj);
  }
  saveStore();
  ov.classList.remove(&quot;open&quot;);
  selId=editId||obj.id;
  renderAll();
});

/* ---------- Vistas mobile ---------- */
function setView(v){
  document.body.classList.toggle(&quot;v-lista&quot;,v===&quot;lista&quot;);
  document.body.classList.toggle(&quot;v-mapa&quot;,v===&quot;mapa&quot;);
  document.getElementById(&quot;tabLista&quot;).classList.toggle(&quot;on&quot;,v===&quot;lista&quot;);
  document.getElementById(&quot;tabMapa&quot;).classList.toggle(&quot;on&quot;,v===&quot;mapa&quot;);
  if(v===&quot;mapa&quot;) setTimeout(()=&gt;map.invalidateSize(),60);
}
document.getElementById(&quot;tabLista&quot;).addEventListener(&quot;click&quot;,()=&gt;setView(&quot;lista&quot;));
document.getElementById(&quot;tabMapa&quot;).addEventListener(&quot;click&quot;,()=&gt;setView(&quot;mapa&quot;));
if(window.innerWidth&gt;760){document.body.classList.remove(&quot;v-lista&quot;,&quot;v-mapa&quot;);}

/* ---------- Bandeirolas do cabeçalho ---------- */
function renderBunting(){
  const wrap=document.getElementById(&quot;bunting&quot;);
  const unit=30; // largura da bandeirola (15+15 de borda), encostadas sem espaço
  const count=Math.ceil(wrap.clientWidth/unit)+3;
  const cores=[&quot;var(--dourado)&quot;,&quot;#F4EBD9&quot;,&quot;var(--vinho2)&quot;];
  let html=&quot;&quot;;
  for(let i=0;i&lt;count;i++){ html+=&#x27;&lt;span class=&quot;flag&quot; style=&quot;--fc:&#x27;+cores[i%3]+&#x27;&quot;&gt;&lt;/span&gt;&#x27;; }
  wrap.innerHTML=html;
}
renderBunting();
window.addEventListener(&quot;resize&quot;,renderBunting);

/* ---------- Cabeçalho ---------- */
document.getElementById(&quot;hdDate&quot;).textContent=hoje.toLocaleDateString(&quot;pt-PT&quot;,{weekday:&quot;long&quot;,day:&quot;numeric&quot;,month:&quot;long&quot;,year:&quot;numeric&quot;});
